<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#feb827"><title>Cámara Kodak</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
:root{--yellow:#feb827;--red:#bd1d17;--cream:#fff8e9}*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 18px 18px;display:flex;justify-content:center;background:var(--yellow);color:var(--red);font-family:'Segoe UI',Tahoma,sans-serif}
.page{width:min(100%,1040px);min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:16px}
header{text-align:center}.heading{display:flex;align-items:center;justify-content:center;gap:12px}
h1{margin:0;font-size:clamp(25px,4vw,34px);font-weight:800}
.intro{max-width:680px;margin:10px auto 0;font-size:15px;line-height:1.5}
.camera-button{width:44px;height:44px;border:2px solid var(--red);border-radius:50%;background:var(--cream);font-size:23px;cursor:pointer}
.viewer{flex:1;min-height:450px;display:flex;flex-direction:column;overflow:hidden;border:2px solid var(--red);border-radius:22px;background:var(--cream);box-shadow:0 8px 0 #75141020}
.viewer-heading{padding:13px 18px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #bd1d1730;font-size:12px;font-weight:750;letter-spacing:.5px;text-transform:uppercase}
.hint{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none}
model-viewer{width:100%;flex:1;min-height:390px;background:var(--cream);--poster-color:var(--cream);--progress-bar-color:var(--red)}
#ar-button{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:13px 24px;border:0;border-radius:28px;background:var(--red);color:var(--yellow);font-size:15px;font-weight:750;white-space:nowrap;cursor:pointer;box-shadow:0 5px 0 #75141030}
.note{text-align:center;margin:0;font-size:12px;line-height:1.5}
.particle{position:fixed;z-index:10;pointer-events:none;font-size:22px;animation:burst .85s ease-out forwards}
@keyframes burst{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
@media(max-width:600px){body{padding:16px 12px}.page{min-height:calc(100vh - 28px);gap:12px}.intro{font-size:13px}.viewer{min-height:400px;border-radius:17px}.viewer-heading{padding:10px 12px;font-size:10px}.hint{font-size:10px}model-viewer{min-height:340px}#ar-button{font-size:14px;padding:12px 19px}}
</style></head><body><div class="page">
<header><div class="heading"><h1>Cámara Kodak</h1><button class="camera-button" id="cameraButton" aria-label="Lanzar camaritas">📸</button></div>
<p class="intro">¡Bienvenido! Acá vas a poder observar y poner a prueba en realidad aumentada la camarita digital Kodak.</p></header>
<main class="viewer" aria-label="Visor interactivo del modelo 3D">
<div class="viewer-heading"><span>Modelo 3D interactivo</span><span class="hint">Girá · acercá · explorá</span></div>
<model-viewer src="./camarita kodak.glb" ios-src="./camarita kodak.usdz" alt="Modelo 3D de una cámara digital Kodak"
camera-controls touch-action="pan-y" interaction-prompt="auto" ar ar-modes="webxr scene-viewer quick-look"
ar-scale="auto" ar-placement="floor" shadow-intensity="1" exposure="1" environment-image="neutral">
<button slot="ar-button" id="ar-button">📸 Ver en tu espacio (AR) 📸</button>
</model-viewer></main>
<footer><p class="note">Arrastrá para girar la cámara y verla desde todos los ángulos. Usá la rueda del mouse o pellizcá la pantalla para acercar y alejar.</p></footer>
</div>
<script>
document.getElementById('cameraButton').addEventListener('click',e=>{
const r=e.currentTarget.getBoundingClientRect(), emojis=['📸','📷','📸','📷','🎞️'];
for(let i=0;i<10;i++){const p=document.createElement('span');p.className='particle';p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
const a=Math.random()*Math.PI*2,d=38+Math.random()*42;p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';
p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');p.style.setProperty('--rot',(Math.random()*70-35)+'deg');
document.body.appendChild(p);setTimeout(()=>p.remove(),900);}
});
</script></body></html>
